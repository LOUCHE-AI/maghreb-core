name: Improvement
description: Something that would make one of the plug-ins better.
labels: [enhancement]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plug-in
      options: [MaghrebDX, MaghrebFM, MaghrebSeq, MaghrebTubu, MaghrebTune, TapeGrain, TapeRepair, TubuDX, All of them]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you change, and why
      description: What you were trying to do when you missed it is the most useful part.
    validations:
      required: true
