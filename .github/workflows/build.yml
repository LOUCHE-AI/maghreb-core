# Builds all eight plug-ins on Linux, Windows and macOS. A pushed tag (v*)
# also attaches the three zips to a GitHub release of that name.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the plug-ins then load on any distro
          # with glibc 2.35 or newer, not only the newest ones.
          - { os: ubuntu-22.04,   name: linux-x86_64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest,   name: macos-universal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages and CLAP headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libcairo2-dev libpango1.0-dev libgtkmm-3.0-dev libsqlite3-dev libxcb-keysyms1-dev
          git clone --depth 1 --branch 1.2.10 https://github.com/free-audio/clap.git "$RUNNER_TEMP/clap"
          # find_path(clap/clap.h) in shared/clap_target.cmake searches <prefix>/include
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/clap" >> "$GITHUB_ENV"

      - name: VST3 SDK
        run: |
          git clone --recursive --depth 1 --shallow-submodules --branch v3.8.1_build_84 \
            https://github.com/steinbergmedia/vst3sdk.git vst/sdk

      # The patch is to VSTGUI's X11 backend, which only Linux compiles.
      - name: VSTGUI patch
        if: runner.os == 'Linux'
        run: cd vst/sdk/vstgui4 && patch -p1 < ../../patches/vstgui-keep-x-connection.patch

      - name: Build
        run: |
          # Keep going past a failure so one run shows every plug-in's errors.
          fail=0
          # The SDK's Objective-C++ parts only configure under the Xcode generator.
          gen=(); [ "$RUNNER_OS" = macOS ] && gen=(-G Xcode)
          for p in MaghrebDX MaghrebFM MaghrebSeq MaghrebTubu MaghrebTune TapeGrain TapeRepair TubuDX; do
            { cmake -S vst/$p -B build/$p "${gen[@]}" -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build/$p --config Release --parallel 4; } || { echo "::error::$p failed"; fail=1; }
          done
          exit $fail

      - name: Package
        run: |
          mkdir -p out/VST3
          cp -R build/*/VST3/Release/*.vst3 out/VST3/
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p out/CLAP && cp build/*/lib/Release/*.clap out/CLAP/
            # the SDK builds with debug info even in Release: 16 MB -> 1.7 MB each
            strip --strip-unneeded out/CLAP/*.clap out/VST3/*.vst3/Contents/x86_64-linux/*.so
          fi
          cp LICENSE vst/NOTICE.txt out/
          # Zipped here, on the system it was built on, so Mac bundles keep
          # their permissions and signatures exactly as built.
          zip_name="maghreb-instruments-${{ matrix.name }}.zip"
          cd out
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "../$zip_name" . > /dev/null
          else zip -qry "../$zip_name" .; fi

      - uses: actions/upload-artifact@v4
        with:
          name: maghreb-instruments-${{ matrix.name }}
          path: maghreb-instruments-${{ matrix.name }}.zip

  release:
    # always(): GitHub's Mac runners are sometimes too busy to start; the
    # Linux and Windows zips should not wait on that.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Eight plug-ins: VST3 on every system, plus CLAP on Linux.

          | System | Download |
          |---|---|
          | Linux (x86-64, Ubuntu 22.04 / Debian 12 or newer) | `maghreb-instruments-linux-x86_64.zip` |
          | Windows 10/11 (64-bit) | `maghreb-instruments-windows-x64.zip` |
          | macOS 10.15+ (Intel and Apple silicon) | `maghreb-instruments-macos-universal.zip` |

          Where the files go, and the one Terminal command macOS needs because
          the plug-ins are not signed by Apple: see the
          [README](https://github.com/LOUCHE-AI/maghreb-instruments#download).

          Something broken? [Open an issue](https://github.com/LOUCHE-AI/maghreb-instruments/issues/new/choose).
          Ideas and tips: [Discussions](https://github.com/LOUCHE-AI/maghreb-instruments/discussions).
          Like them? [Ko-fi](https://ko-fi.com/louloulouche).
          EOF
          gh release create "$GITHUB_REF_NAME" maghreb-instruments-*.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
